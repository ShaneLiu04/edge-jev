# AR022 GPU 吞吐档：parallel=4 + 16k ctx（每 slot 4k），自动槽位。
# 真实并发 4：parallel4 墙钟 4386ms vs parallel1 8152ms（1.86x），quality 1.0。
# 需要文档亲和时用 latency-best-gpu-affinity.toml（parallel=2 + scheduler）。
[portfolio]
name = "latency-best-gpu-throughput"

[runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
allocator_enabled = false
prefix_cache = true
session_affinity = true
decision_shadow = false
decision_post = false
decision_permutations = 1
decision_staged = true
decision_staged_minimal = true
decision_long_context_tokens = 4000
decision_long_context_gate_tokens = 384
decision_long_context_gate_windows = [128, 384]
stable_compression = true
stable_compression_ratio = 0.4
stable_compression_block_tokens = 128
stable_compression_min_tokens = 512
stable_compression_cache_entries = 64
stable_compression_embed_batch = 16

[prefill]
enabled = false
evidence = false
adaptive = false

[cerebrum]
ctx_size = 16384
parallel = 4
slot_scheduler_enabled = false
gpu_layers = 99
tier_enabled = true
small_model = "models/qwen/qwen2.5-0.5b-instruct-q4_k_m.gguf"
small_gpu_layers = 99
small_port = 0
tier_ground_window = 600
tier_max_answer_chars = 64
tier_prewarm = true
