  # ---- English · complex · reasoning (expect full) ×6 ----
  - id: en-full-01
    lang: en
    category: complex
    expect_route: full
    messages:
      - role: user
        content: "Write a 200-word essay analyzing how remote work affects team collaboration."
  - id: en-full-02
    lang: en
    category: complex
    expect_route: full
    messages:
      - role: user
        content: "Explain the mechanism of transformer attention and why it beats RNNs."
  - id: en-full-03
    lang: en
    category: complex
    expect_route: full
    messages:
      - role: user
        content: "Write a Python function that deduplicates a list while preserving order, and explain your approach."
  - id: en-full-04
    lang: en
    category: complex
    expect_route: full
    messages:
      - role: user
        content: "Compare the time complexity and use cases of three sorting algorithms, then conclude."
  - id: en-full-05
    lang: en
    category: complex
    expect_route: full
    turns: 2
    messages:
      - role: user
        content: "We are designing an order API. What should we consider for idempotency?"
      - role: assistant
        content: "Use an idempotency key and deduplicate writes."
      - role: user
        content: "Good. Now design the full endpoint and list the key points."
  - id: en-full-06
    lang: en
    category: complex
    expect_route: full
    turns: 2
    messages:
      - role: user
        content: "There are three switches and three lamps. Can you solve it?"
      - role: assistant
        content: "You may enter the room only once."
      - role: user
        content: "Analyze the logic puzzle and determine the mapping strategy."
