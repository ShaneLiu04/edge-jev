  # ---- English · simple · light generation (expect light) ×4 ----
  - id: en-light-01
    lang: en
    category: simple
    expect_route: light
    messages:
      - role: user
        content: "Introduce yourself in one sentence."
  - id: en-light-02
    lang: en
