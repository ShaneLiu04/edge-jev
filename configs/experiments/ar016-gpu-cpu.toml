# AR016 GPU 放置基线：CPU decode + GPU embedding（当前最优）。
name = "ar016-gpu-cpu"
seed = 20261026
lambda_cost = 0.15
lambda_latency = 0.50
limit = 12
dataset = "shared_prefix"
brain = "spawn"
embedding = "auto"
gpu_layers = 0
embedding_gpu_layers = 99
ctx_size = 8192
