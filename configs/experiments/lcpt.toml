# AR014 LCPT-RFG 隔离实验：长上下文 int8 reasoning 门控 vs RDMP。
name = "ar014-lcpt"
seed = 20261026
lambda_cost = 0.15
lambda_latency = 0.50
limit = 12
dataset = "shared_prefix"
brain = "spawn"
embedding = "off"
gpu_layers = 0
ctx_size = 8192
max_tokens = 32
timeout_s = 300.0
prompt_prefix = ""
