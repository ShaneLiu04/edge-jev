# AR011 服务器 7B 联合最优复刻：ADB + CACHE/CASC + LADS fast（external 大脑/embedding）。
# 需先按 REPRODUCTION.md 启动 7B llama-server(8388) 与 embedding(8389)。
name = "ar011-server-7b-adb-casc"
seed = 20261026
lambda_cost = 0.15
lambda_latency = 0.50
limit = 30
dataset = "shared_prefix"
brain = "external"
brain_base_url = "http://127.0.0.1:8388"
embedding = "external"
embedding_base_url = "http://127.0.0.1:8389"
ctx_size = 16384
max_tokens = 128
timeout_s = 600.0
prompt_prefix = ""
prompt_cache = true
force_full = true
arms = ["B1", "ADB_CACHE", "ADB_CASC", "ADB_CACHE_FAST", "ADB_CASC_FAST"]

[overlays.ADB_CACHE.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true
decision_permutations = 1

[overlays.ADB_CASC.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true
decision_permutations = 1
stable_compression = true
stable_compression_ratio = 0.4
stable_compression_block_tokens = 128
stable_compression_min_tokens = 512
stable_compression_cache_entries = 128
stable_compression_embed_batch = 32

[overlays.ADB_CACHE_FAST.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true
decision_shadow = false
decision_post = false
decision_permutations = 1

[overlays.ADB_CASC_FAST.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true
decision_shadow = false
decision_post = false
decision_permutations = 1
stable_compression = true
stable_compression_ratio = 0.4
stable_compression_block_tokens = 128
stable_compression_min_tokens = 512
stable_compression_cache_entries = 128
stable_compression_embed_batch = 32
