# AR012 服务器 7B 复现：external brain(8388) + embedding(8389)。
# 修正：每个 arm 使用完整 runtime overlay，避免只设置 decision_staged 导致
# enabled/prefix_cache 等开关未生效。
name = "ar012-server-7b-cadp-casc"
seed = 20261026
lambda_cost = 0.15
lambda_latency = 0.50
limit = 30
dataset = "shared_prefix"
brain = "external"
brain_base_url = "http://127.0.0.1:8388"
embedding = "external"
embedding_base_url = "http://127.0.0.1:8389"
ctx_size = 16384
max_tokens = 128
timeout_s = 600.0
prompt_prefix = ""
prompt_cache = true
force_full = false
arms = ["B1", "ADB_CACHE_FAST", "CADP_CACHE_FAST", "CADP_CASC_FAST"]

[overlays.ADB_CACHE_FAST.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true
decision_shadow = false
decision_post = false
decision_permutations = 1

[overlays.CADP_CACHE_FAST.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true
decision_shadow = false
decision_post = false
decision_permutations = 1
decision_staged = true

[overlays.CADP_CASC_FAST.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true
decision_shadow = false
decision_post = false
decision_permutations = 1
decision_staged = true
stable_compression = true
stable_compression_ratio = 0.4
stable_compression_block_tokens = 128
stable_compression_min_tokens = 512
stable_compression_cache_entries = 64
stable_compression_embed_batch = 16
