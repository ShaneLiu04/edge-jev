# AR005 长上下文 needles 实验：验证 prefill/JCBA 的 token 节省与保留率。
# 说明：本环境长 prompt 下 B2 开启 verifier/memory 会触发 llama-server 假死，
# 因此本档显式关闭二者，仅隔离 prefill/JCBA 效果（结果见 docs/RESULTS.md）。
name = "ar005-needles"
seed = 20261026
lambda_cost = 0.15
limit = 12
dataset = "needles"
brain = "spawn"
embedding = "off"
gpu_layers = 99
ctx_size = 4096
max_tokens = 16
timeout_s = 240.0
prompt_prefix = ""
arms = ["B1", "B2", "AR005"]

[overlays.B2.runtime]
verifier_enabled = false
memory_enabled = false

[overlays.AR005.runtime]
verifier_enabled = false
memory_enabled = false
