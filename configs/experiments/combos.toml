# AR006 本机组合实验（真实 Laya + 真实 llama-server + 真实 embedding）。
# 目的：比较固定预算 vs 证据/自适应预算，找出综合最优组合；无增益即回退。
name = "ar006-needles-combos"
seed = 20261026
lambda_cost = 0.15
limit = 12
dataset = "needles"
brain = "spawn"
embedding = "auto"
gpu_layers = 99
ctx_size = 4096
max_tokens = 16
timeout_s = 240.0
prompt_prefix = ""
arms = ["B1", "P60", "AEB", "AEB_ALLOC"]

[overlays.P60.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false

[overlays.P60.prefill]
enabled = true
budget_ratio = 0.6
adaptive = false
evidence = false

[overlays.AEB.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false

[overlays.AEB.prefill]
enabled = true
budget_ratio = 0.6
adaptive = true
evidence = true
anchor = true

[overlays.AEB_ALLOC.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
allocator_enabled = true
allocator_budget_ratio = 0.6

[overlays.AEB_ALLOC.prefill]
enabled = true
budget_ratio = 0.6
adaptive = true
