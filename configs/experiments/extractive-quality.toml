# AR020 GEXA non-regression on ordinary quality questions (no documents -> all miss).
drop_first = true
name = "ar020-extractive-quality"
seed = 20261026
lambda_cost = 0.15
lambda_latency = 0.50
limit = 30
dataset = "quality"
brain = "spawn"
embedding = "auto"
gpu_layers = 99
embedding_gpu_layers = 0
ctx_size = 8192
max_tokens = 64
timeout_s = 300.0
prompt_prefix = ""
prompt_cache = true
force_full = false
arms = ["CGW_CASC_FAST", "GEXA_CGW_CASC_FAST"]

[overlays.CGW_CASC_FAST.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true
decision_shadow = false
decision_post = false
decision_permutations = 1
decision_staged = true
decision_staged_minimal = true
decision_long_context_tokens = 4000
decision_long_context_gate_tokens = 384
decision_long_context_gate_windows = [128, 384]
stable_compression = true
stable_compression_ratio = 0.4
stable_compression_block_tokens = 128
stable_compression_min_tokens = 512
stable_compression_cache_entries = 64
stable_compression_embed_batch = 16

[overlays.GEXA_CGW_CASC_FAST.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true
decision_shadow = false
decision_post = false
decision_permutations = 1
decision_staged = true
decision_staged_minimal = true
decision_long_context_tokens = 4000
decision_long_context_gate_tokens = 384
decision_long_context_gate_windows = [128, 384]
stable_compression = true
stable_compression_ratio = 0.4
stable_compression_block_tokens = 128
stable_compression_min_tokens = 512
stable_compression_cache_entries = 64
stable_compression_embed_batch = 16

[overlays.GEXA_CGW_CASC_FAST.extractive]
enabled = true
min_document_chars = 200
max_answer_chars = 64
max_anchor_occurrences = 64
