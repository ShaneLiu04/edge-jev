# AR008 解码隔离实验：短 prompt + 长输出，仅比较 B1 与 CPU-draft 投机解码。
name = "ar008-spec-short"
seed = 20261026
lambda_cost = 0.15
lambda_latency = 0.50
limit = 12
dataset = "long_generation"
brain = "spawn"
embedding = "off"
gpu_layers = 99
ctx_size = 4096
max_tokens = 192
timeout_s = 300.0
prompt_prefix = ""
prompt_cache = false
force_full = true
arms = ["B1", "SPEC"]

[overlays.SPEC.cerebrum.spec]
enabled = true
draft_model = "models/qwen/qwen2.5-0.5b-instruct-q4_k_m.gguf"
type = "draft-simple"
draft_n_max = 12
draft_gpu_layers = 0
draft_threads = 12
sampling = "greedy"
