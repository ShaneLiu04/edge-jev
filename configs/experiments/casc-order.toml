# AR009 顺序对照：CASC 在 CACHE 之前，检验热漂移/顺序偏差。
name = "ar009-casc-order"
seed = 20261026
lambda_cost = 0.15
lambda_latency = 0.50
limit = 12
dataset = "shared_prefix"
brain = "spawn"
embedding = "auto"
gpu_layers = 0
embedding_gpu_layers = 99
ctx_size = 8192
max_tokens = 32
timeout_s = 300.0
prompt_prefix = ""
prompt_cache = true
force_full = true
arms = ["CASC", "CACHE"]

[overlays.CACHE.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true

[overlays.CASC.runtime]
enabled = true
verifier_enabled = false
memory_enabled = false
prefix_cache = true
session_affinity = true
stable_compression = true
stable_compression_ratio = 0.4
stable_compression_block_tokens = 128
stable_compression_min_tokens = 512
stable_compression_cache_entries = 64
stable_compression_embed_batch = 16
