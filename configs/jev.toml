# Jev 运行时配置（单源，DuoMind 同构）
# design.md §4.1 关键设计决策 5：后端选择/模型路径/端口/级联阈值/熔断参数

[server]
host = "127.0.0.1"
port = 8300

[cerebellum]
default_backend = "laya_onnx"          # laya_onnx（进程内，默认） | kev（子进程 HTTP）

[cerebellum.laya_onnx]
model_path = "models/laya/laya.onnx"    # jev fetch 落位路径
calibration_path = "models/laya/calibration.json"

[cerebellum.kev]
serve_url = "http://127.0.0.1:8311"     # kev.serve 子进程端点
model_path = "models/kev/kev-0.8B"

[cerebrum]
llama_server_bin = "models/llama-server/bin/llama-server.exe"
gguf_path = "models/qwen/qwen2.5-1.5b-instruct-q4_k_m.gguf"
ctx_size = 4096
startup_probe = "/health"
restart_max = 3
parallel = 1                             # AR003 多槽：并行请求共享前缀（1=关闭）
supervisor_enabled = false               # AR006 大脑自愈监督（默认关闭）
health_interval_s = 30.0                 # 健康探针最小间隔
health_timeout_s = 3.0                   # 探针超时（秒）
max_recoveries = 5                       # 一小时最大重启次数
recovery_cooldown_s = 5.0                # 两次重启最小间隔
# slot_prompt_similarity = 0.5          # AR003 槽位前缀相似度阈值（留空=llama 默认）                          # 崩溃自动重启上限（指数退避 2s/4s/8s）

[cerebrum.spec]
enabled = false                          # AR008 投机解码（本机实测无增益，默认关闭）
draft_model = "models/qwen/qwen2.5-0.5b-instruct-q4_k_m.gguf"
type = "draft-simple"
draft_n_max = 8
draft_gpu_layers = 0
draft_threads = 8

[cascade]
generation_timeout_s = 120               # 路径②/③ 生成总时长上限（EX-04：超时截断降级）
capability_gate = true                   # AR002 能力门控路由（false 恢复 AR001 行为）
light_requires_low_complexity = false    # AR002 实测：真实 laya 复杂度门不稳，默认放宽
draft_injection = false                  # AR002 PRE 草稿注入（full 路径 system 前缀 + 历史压缩）
keep_turns = 2                           # 草稿注入时保留最近原文轮数（更早轮次压成摘要）
# max_brain_tokens = 6000                # AR002 请求级预算（默认关闭；开启后可降级 light）
# max_latency_ms = 8000                  # AR002 延迟预算（默认关闭；仅记录不强制中断）
# 口径修订（design §4.5）：τ 单源于 configs/decision-points.toml（逐点声明）；
# 路径② 分段预算 LIGHT_SEGMENT_TOKENS=128 与 MID 早停为代码单源常量。

[breaker]
window_s = 60                            # 滑动窗口
failure_threshold = 3                    # 窗口内失败数阈值
cooldown_s = 30                          # 初始冷却（指数翻倍，上限 cooldown_max_s）
cooldown_max_s = 120

[fetch]
proxy_ntlm = true                       # 企业 NTLM 代理（Windows SSPI 单点登录）；无代理环境置 false
proxy_url = "http://proxyhk.huawei.com:8080"  # 显式下载代理（覆盖 env；置空串则走标准 env 代理）

[ledger]
dir = "data/ledger"                      # JSONL 台账目录（gitignored）
queue_maxsize = 10000
warn_after_failures = 100

# AR003 运行时智能（全部默认关闭，保持 AR002 逐例回归）
[runtime]
enabled = false
tau_low = 0.35
tau_high = 0.65
verifier_enabled = false
self_verify_mode = "observe"
gate_threshold = 0.60
verifier_max_tokens = 16
draft_injection = false
memory_enabled = false
keep_turns = 2
risk_control = false
risk_calibration = ""
risk_alpha = 0.10
allocator_enabled = false
allocator_budget_ratio = 0.6
allocator_min_prompt_tokens = 512
prefix_cache = false             # AR007 服务器前缀 KV 复用（默认关闭）
session_affinity = false         # AR007 有 user 会话键时用稳定前缀
stable_compression = false       # AR009 文档级稳定压缩（与前缀缓存叠加）
stable_compression_ratio = 0.6
stable_compression_block_tokens = 128
stable_compression_min_tokens = 512
stable_compression_min_blocks = 4
stable_compression_mmr_lambda = 0.75
stable_compression_cache_entries = 64
stable_compression_embed_batch = 16
decision_shadow = true            # AR010：chat 路径评估 shadow 决策点（false=fast）
decision_post = true              # AR010：chat 路径执行 POST 复核/重试（false=fast）

[cache]
enabled = false
similarity = 0.93
margin = 0.02
ttl_s = 1800.0
capacity = 256
conformal_admission = false
admission_calibration = ""
admission_alpha = 0.10
admission_min_recall = 0.60

[prefill]
enabled = false
budget_ratio = 0.6
min_prompt_tokens = 512
min_blocks = 4
block_tokens = 256
adaptive = false                 # AR006 自适应预算比例
evidence = false                 # AR006 embedding 证据选择
anchor = true                    # AR006 证据锚点必选
evidence_embed_weight = 0.55
evidence_lexical_weight = 0.25
evidence_position_weight = 0.10
evidence_decision_weight = 0.10
evidence_mmr_lambda = 0.25
adaptive_min_ratio = 0.22
adaptive_max_ratio = 0.60

[embeddings]
model_path = ""
base_url = ""
model = "local"
port = 8389
timeout_s = 10.0
gpu_layers = 0                   # AR009：embedding 独立放置（CPU 解码 + GPU 编码）

[portfolio]
profile = ""
